upstream ipinfo {
    server 127.0.0.1:8000;
}

# Main site — serves the HTML page
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    location / {
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        # Do NOT forward X-Forwarded-For here — page only serves HTML
    }
}

# IPv4-only subdomain — A record only, no AAAA
server {
    listen 80;
    server_name ipv4.yourdomain.com;

    location /ip {
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# IPv6-only subdomain — AAAA record only, no A
server {
    listen [::]:80;
    server_name ipv6.yourdomain.com;

    location /ip {
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
