upstream ipinfo {
    server 127.0.0.1:8000;
}

# ── Port 80: ACME challenge + HTTPS redirect ──────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# IPv4-only subdomain — A record only, no AAAA
server {
    listen 80;
    server_name ip4.alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# IPv6-only subdomain — AAAA record only, no A
server {
    listen [::]:80;
    server_name ip6.alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Shared TLS settings ───────────────────────────────────────────────────

ssl_certificate     /etc/letsencrypt/live/alexander-hagemann.de/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/alexander-hagemann.de/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

# ── Port 443: HTTPS ───────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        # Do NOT forward X-Forwarded-For here — page only serves HTML
    }
}

server {
    listen 443 ssl;
    server_name ip4.alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /ip {
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen [::]:443 ssl;
    server_name ip6.alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /ip {
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
