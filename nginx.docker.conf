access_log off;

# 10m zone holds ~160k IPs; 20 requests/minute per IP on the /ip endpoints
limit_req_zone $binary_remote_addr zone=ip_lookup:10m rate=20r/m;

# 10m zone; 10 requests/minute per IP on the up-checker (each request triggers
# an outbound connection from the server, so it's rate-limited tighter than /ip)
limit_req_zone $binary_remote_addr zone=upcheck:10m rate=10r/m;

# 10m zone; the analytics beacon fires once per pageview, so this is
# deliberately looser than /ip — it must not drop legitimate navigation.
limit_req_zone $binary_remote_addr zone=count:10m rate=60r/m;

# Max concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Rate-limit rejections log the full client IP at "error" level by default;
# drop them to "notice" so they're filtered by the default error_log level.
limit_req_log_level notice;
limit_conn_log_level notice;

# Treat "Do Not Track" and "Global Privacy Control" as an objection under
# Art. 21 DSGVO (see LG Berlin, 24.08.2023, 16 O 420/19). Both are request
# headers, so this covers the JS beacon and the <noscript> pixel alike — which
# is the only opt-out available to visitors without JavaScript, since the
# opt-out button needs localStorage.
# The key is the two headers concatenated; either one set to 1 is enough.
map $http_dnt$http_sec_gpc $analytics_optout {
    default 0;
    "~1"    1;
}

upstream ipinfo {
    server 127.0.0.1:8000;
}

upstream goatcounter {
    server 127.0.0.1:8081;
}

# ── Port 80: ACME challenge + HTTPS redirect ──────────────────────────────

server {
    listen 8080;
    listen [::]:8080;
    server_name alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8080;
    server_name ip4.alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen [::]:8080;
    server_name ip6.alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8080;
    listen [::]:8080;
    server_name stats.alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Shared TLS settings ───────────────────────────────────────────────────

ssl_certificate     /etc/letsencrypt/live/alexander-hagemann.de/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/alexander-hagemann.de/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

# ── Port 443: HTTPS ───────────────────────────────────────────────────────

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_conn conn_limit 10;

    # ── First-party analytics ─────────────────────────────────────────────
    # The tracker script and its beacon are served from this domain so no
    # visitor request ever leaves alexander-hagemann.de. GoatCounter picks the
    # site by Host header, so it must be rewritten to the stats vhost — the
    # site created with `db create site -vhost=stats.alexander-hagemann.de`.

    location = /count.js {
        proxy_pass http://goatcounter;
        proxy_set_header Host stats.alexander-hagemann.de;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /count {
        # Runs in the rewrite phase, so an opted-out request is dropped before
        # it reaches the rate limiter or the upstream. `return` is one of the
        # two safe uses of `if` in a location.
        if ($analytics_optout) {
            return 204;
        }

        limit_req zone=count burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://goatcounter;
        proxy_set_header Host stats.alexander-hagemann.de;
        proxy_set_header X-Forwarded-Proto https;
        # GoatCounter resolves the visitor's country and builds its rotating
        # daily visitor hash from the client IP, so it needs the real one.
        # Both headers are *set*, never appended, so a client cannot spoof them.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # GoatCounter's real-IP middleware trusts these CDN headers ahead of
        # X-Real-IP; clear them so they can't be forged by the client.
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header Fly-Client-Ip "";
        proxy_set_header X-Azure-Socketip "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

server {
    listen 8443 ssl;
    server_name ip4.alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_conn conn_limit 5;

    location /ip {
        limit_req zone=ip_lookup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

server {
    listen [::]:8443 ssl;
    server_name ip6.alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_conn conn_limit 5;

    location /ip {
        limit_req zone=ip_lookup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/up {
        limit_req zone=upcheck burst=3;
        limit_req_status 429;
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}

# ── Analytics dashboard (login required, owner only) ──────────────────────

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name stats.alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_conn conn_limit 10;

    # GoatCounter's own /count is reachable here too. The site's pages don't
    # use it, but the DNT/GPC promise must hold on every path that can count.
    location = /count {
        if ($analytics_optout) {
            return 204;
        }

        limit_req zone=count burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://goatcounter;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header Fly-Client-Ip "";
        proxy_set_header X-Azure-Socketip "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://goatcounter;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header Fly-Client-Ip "";
        proxy_set_header X-Azure-Socketip "";
        proxy_connect_timeout 5s;
        # CSV exports and the larger dashboard queries can outlast 10s.
        proxy_read_timeout 60s;
    }
}
