log_format ipinfo '$remote_addr [$time_local] "$request" $status ${request_time}s "$http_user_agent"';
access_log /var/log/nginx/access.log ipinfo;

# 10m zone holds ~160k IPs; 20 requests/minute per IP on the /ip endpoints
limit_req_zone $binary_remote_addr zone=ip_lookup:10m rate=20r/m;

# Max concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream ipinfo {
    server app:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    limit_conn conn_limit 10;

    location / {
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

server {
    listen 80;
    server_name ipv4.yourdomain.com;

    limit_conn conn_limit 5;

    location /ip {
        limit_req zone=ip_lookup burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

server {
    listen [::]:80;
    server_name ipv6.yourdomain.com;

    limit_conn conn_limit 5;

    location /ip {
        limit_req zone=ip_lookup burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
