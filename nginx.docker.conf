access_log off;

# 10m zone holds ~160k IPs; 20 requests/minute per IP on the /ip endpoints
limit_req_zone $binary_remote_addr zone=ip_lookup:10m rate=20r/m;

# Max concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Rate-limit rejections log the full client IP at "error" level by default;
# drop them to "notice" so they're filtered by the default error_log level.
limit_req_log_level notice;
limit_conn_log_level notice;

upstream ipinfo {
    server 127.0.0.1:8000;
}

# ── Port 80: ACME challenge + HTTPS redirect ──────────────────────────────

server {
    listen 8080;
    listen [::]:8080;
    server_name alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8080;
    server_name ip4.alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen [::]:8080;
    server_name ip6.alexander-hagemann.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Shared TLS settings ───────────────────────────────────────────────────

ssl_certificate     /etc/letsencrypt/live/alexander-hagemann.de/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/alexander-hagemann.de/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

# ── Port 443: HTTPS ───────────────────────────────────────────────────────

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_conn conn_limit 10;

    location / {
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

server {
    listen 8443 ssl;
    server_name ip4.alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_conn conn_limit 5;

    location /ip {
        limit_req zone=ip_lookup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

server {
    listen [::]:8443 ssl;
    server_name ip6.alexander-hagemann.de;

    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_conn conn_limit 5;

    location /ip {
        limit_req zone=ip_lookup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ipinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
