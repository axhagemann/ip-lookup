services:
  app:
    build: .
    restart: unless-stopped
    # Defence in depth behind the capped body reads in upcheck.py: if a checked
    # site ever does get a large body past them, one container restarts instead
    # of the host running out of memory.
    mem_limit: 256m
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal
    environment:
      # Retry a detected bot-protection challenge once with a browser TLS
      # fingerprint. Off by default: it succeeds only about half the time, so
      # it changes the wording of a result that already reads "up" either way.
      - UPCHECK_IMPERSONATE=${UPCHECK_IMPERSONATE:-0}
    volumes:
      - geoip_data:/app/geoip
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy

  goatcounter:
    image: arp242/goatcounter:2.7.0
    restart: unless-stopped
    # Localhost only — nginx (host network) reaches it at 127.0.0.1:8081.
    # Never expose this port publicly; TLS and rate limiting live in nginx.
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - internal
    # -automigrate runs pending schema migrations on startup, so bumping the
    # image tag is all an upgrade needs.
    command: ["serve", "-automigrate", "-listen=:8081"]
    volumes:
      - goatcounter_data:/home/goatcounter/goatcounter-data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate
    restart: unless-stopped
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City GeoLite2-ASN
      - GEOIPUPDATE_FREQUENCY=168
    volumes:
      - geoip_data:/usr/share/GeoIP


networks:
  internal:
    driver: bridge
    enable_ipv6: false

volumes:
  geoip_data:
  goatcounter_data:   # SQLite analytics DB — include in backups
