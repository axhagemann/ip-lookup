services:
  app:
    build: .
    restart: unless-stopped
    networks:
      - internal
    # no ports exposed — only reachable via nginx on the internal network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "[::]:80:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
    driver: bridge
    enable_ipv6: false  # internal traffic is IPv4-only; host-facing IPv6 handled by Docker
