services:
  app:
    build: .
    restart: unless-stopped
    networks:
      - internal
    # no ports exposed — only reachable via nginx on the internal network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ip')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
    enable_ipv6: false  # internal traffic is IPv4-only; host-facing IPv6 handled by Docker
