<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My IP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Courier New", Courier, monospace;
      background: #000;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem 2rem 5rem;
    }

    h1 {
      font-size: 0.7rem;
      color: #999;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1::before { content: "// "; }

    .cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 860px;
    }

    .card {
      border: 1px solid #222;
      padding: 1.5rem;
      flex: 1;
      min-width: 280px;
    }

    .card-header {
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: bold;
      padding: 0.15rem 0.45rem;
      border: 1px solid;
      letter-spacing: 0.1em;
      font-family: "Courier New", Courier, monospace;
    }

    .badge-v4 { border-color: #e0e0e0; color: #e0e0e0; }
    .badge-v6 { border-color: #999; color: #999; }

    .ip-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      word-break: break-all;
      margin-bottom: 1.25rem;
      letter-spacing: 0.02em;
      min-height: 1.8rem;
    }

    .ip-value.loading { color: #999; }
    .ip-value.loading::after {
      content: "_";
      color: #999;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .geo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem 1rem;
    }

    .geo-item label {
      display: block;
      font-size: 0.6rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.1rem;
    }

    .geo-item span { font-size: 0.85rem; color: #bbb; }

    .unavailable { color: #999; font-size: 1.25rem; }

    .copy-btn {
      background: none;
      border: 1px solid #222;
      color: #999;
      padding: 0.25rem 0.65rem;
      cursor: pointer;
      font-size: 0.7rem;
      font-family: "Courier New", Courier, monospace;
      margin-top: 1rem;
      letter-spacing: 0.05em;
      transition: border-color 0.1s, color 0.1s;
    }
    .copy-btn:hover  { border-color: #888; color: #e0e0e0; }
    .copy-btn.copied { border-color: #fff; color: #fff; }

    .footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 1.5rem;
      align-items: flex-end;
    }

    .footer-links { display: flex; gap: 1.5rem; }

    .footer a {
      font-size: 0.6rem;
      color: #999;
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .footer a:hover { color: #fff; }

    .maxmind-notice { font-size: 0.6rem; color: #e0e0e0; }
    .maxmind-notice a { color: #e0e0e0; }
    .maxmind-notice a:hover { color: #fff; }
  </style>
</head>
<body>
  <h1>Your IP Address</h1>

  <div class="cards">
    <div class="card" id="card-v4">
      <div class="card-header">
        <span class="badge badge-v4">IPv4</span>
      </div>
      <div class="ip-value loading" id="ip-v4"></div>
      <div id="geo-v4"></div>
    </div>

    <div class="card" id="card-v6">
      <div class="card-header">
        <span class="badge badge-v6">IPv6</span>
      </div>
      <div class="ip-value loading" id="ip-v6"></div>
      <div id="geo-v6"></div>
    </div>
  </div>

  <div class="footer">
    <p class="maxmind-notice">This product includes GeoLite2 data created by MaxMind, available from <a href="https://www.maxmind.com" target="_blank" rel="noopener">maxmind.com</a></p>
    <div class="footer-links">
      <a href="/impressum.html">Impressum</a>
      <a href="/datenschutz.html">Datenschutz</a>
    </div>
  </div>

  <script>
    const IPV4_ENDPOINT = "https://ip4.alexander-hagemann.de/ip";
    const IPV6_ENDPOINT = "https://ip6.alexander-hagemann.de/ip";

    function renderGeo(geo) {
      if (!geo || Object.keys(geo).length === 0) return "";
      const fields = [
        ["Country", geo.country],
        ["Region", geo.region],
        ["City", geo.city],
        ["ISP", geo.isp],
        ["Timezone", geo.timezone],
        ["Coordinates", geo.latitude && geo.longitude
          ? `${geo.latitude}, ${geo.longitude}` : null],
      ];
      return `<div class="geo-grid">
        ${fields.filter(([, v]) => v).map(([label, value]) =>
          `<div class="geo-item"><label>${label}</label><span>${value}</span></div>`
        ).join("")}
      </div>`;
    }

    function copyBtn(ip) {
      return `<button class="copy-btn" onclick="copyIP(this, '${ip}')">Copy IP</button>`;
    }

    async function copyIP(btn, ip) {
      await navigator.clipboard.writeText(ip);
      btn.textContent = "Copied!";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "Copy IP"; btn.classList.remove("copied"); }, 1500);
    }

    async function fetchIP(endpoint, ipEl, geoEl) {
      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error();
        const { ip, geo } = await res.json();
        ipEl.textContent = ip;
        ipEl.classList.remove("loading");
        geoEl.innerHTML = renderGeo(geo) + copyBtn(ip);
      } catch {
        ipEl.textContent = "Not available";
        ipEl.classList.add("unavailable");
        ipEl.classList.remove("loading");
      }
    }

    fetchIP(IPV4_ENDPOINT, document.getElementById("ip-v4"), document.getElementById("geo-v4"));
    fetchIP(IPV6_ENDPOINT, document.getElementById("ip-v6"), document.getElementById("geo-v6"));
  </script>
</body>
</html>
