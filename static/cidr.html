<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Calculate the start and end address of an IPv4 or IPv6 CIDR range." />
  <title>CIDR Range Calculator</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      justify-content: center;
      gap: 2rem;
      padding: 2rem 2rem 5rem;
    }

    .description {
      font-size: 0.85rem;
      color: #c0c0c0;
      text-align: center;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .card {
      border: 1px solid #222;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field-row {
      display: flex;
      gap: 0.75rem;
    }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    .field-ip { flex: 3; }
    .field-prefix { flex: 1; }

    label {
      font-size: 0.75rem;
      color: #c0c0c0;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .prefix-input-wrap {
      display: flex;
      align-items: center;
      border: 1px solid #666;
    }

    .prefix-input-wrap span {
      padding: 0 0 0 0.6rem;
      color: #c0c0c0;
    }

    input {
      background: #000;
      border: 1px solid #666;
      color: #e0e0e0;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.9rem;
      padding: 0.5rem 0.6rem;
      width: 100%;
    }

    .prefix-input-wrap input {
      border: none;
      padding-left: 0.3rem;
    }

    input:focus { outline: none; border-color: #e0e0e0; }
    .prefix-input-wrap:focus-within { border-color: #e0e0e0; }

    button {
      background: none;
      border: 1px solid #666;
      color: #c0c0c0;
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.1s, color 0.1s;
    }
    button:hover { border-color: #888; color: #e0e0e0; }

    .error {
      font-size: 0.8rem;
      color: #e0e0e0;
      border: 1px dashed #666;
      padding: 0.6rem 0.8rem;
      display: none;
    }
    .error.visible { display: block; }

    .result {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #1a1a1a;
      display: none;
    }
    .result.visible { display: block; }

    .result dl {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.9rem;
    }

    .result dt {
      font-size: 0.75rem;
      color: #c0c0c0;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.2rem;
    }

    .result dd {
      font-size: 1.15rem;
      font-weight: bold;
      color: #fff;
      word-break: break-all;
    }

    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
    }

    .footer-links { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }

    .footer-links a {
      font-size: 0.75rem;
      color: #c0c0c0;
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .footer-links a:hover { color: #fff; }

    @media (max-width: 480px) {
      footer { position: static; margin-top: 1rem; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <main id="main">
    <a class="back" href="/"><span aria-hidden="true">← </span>Home</a>

    <h1><span aria-hidden="true">// </span>CIDR Range Calculator</h1>

    <p class="description">
      Enter an IPv4 or IPv6 address and a prefix length to get the first
      and last address of that range.
    </p>

    <div class="card">
      <form id="cidr-form" novalidate>
        <div class="field-row">
          <div class="field field-ip">
            <label for="ip-input">IP Address</label>
            <input type="text" id="ip-input" name="ip" placeholder="192.168.1.10" autocomplete="off" spellcheck="false" required />
          </div>
          <div class="field field-prefix">
            <label for="prefix-input">Prefix</label>
            <div class="prefix-input-wrap">
              <span aria-hidden="true">/</span>
              <input type="number" id="prefix-input" name="prefix" placeholder="24" min="0" max="128" inputmode="numeric" required />
            </div>
          </div>
        </div>

        <button type="submit">Calculate</button>
      </form>

      <p class="error" id="error-msg" role="alert"></p>

      <div class="result" id="result">
        <dl>
          <div>
            <dt>Start of Range</dt>
            <dd id="result-start"></dd>
          </div>
          <div>
            <dt>End of Range</dt>
            <dd id="result-end"></dd>
          </div>
        </dl>
      </div>
    </div>
  </main>

  <footer>
    <nav class="footer-links" aria-label="Legal">
      <a href="/impressum.html" lang="de">Impressum</a>
      <a href="/datenschutz.html" lang="de">Datenschutz</a>
      <a href="/privacy.html" lang="en">Privacy</a>
    </nav>
  </footer>

  <script>
    function parseIPv4(ip) {
      const parts = ip.split(".");
      if (parts.length !== 4) return null;
      let result = 0n;
      for (const p of parts) {
        if (!/^\d{1,3}$/.test(p)) return null;
        const n = parseInt(p, 10);
        if (n > 255) return null;
        result = (result << 8n) | BigInt(n);
      }
      return result;
    }

    function formatIPv4(n) {
      const parts = [];
      for (let i = 3; i >= 0; i--) {
        parts.push(Number((n >> BigInt(i * 8)) & 0xffn));
      }
      return parts.join(".");
    }

    function parseIPv6(ip) {
      if (ip.indexOf(":") === -1) return null;

      let address = ip;
      const lastColon = address.lastIndexOf(":");
      const tailToken = address.slice(lastColon + 1);
      if (tailToken.indexOf(".") !== -1) {
        const v4 = parseIPv4(tailToken);
        if (v4 === null) return null;
        const hi = ((v4 >> 16n) & 0xffffn).toString(16);
        const lo = (v4 & 0xffffn).toString(16);
        address = address.slice(0, lastColon + 1) + hi + ":" + lo;
      }

      const doubleColonParts = address.split("::");
      if (doubleColonParts.length > 2) return null;

      let head = doubleColonParts[0] ? doubleColonParts[0].split(":") : [];
      let tail = [];
      let groups;

      if (doubleColonParts.length === 1) {
        groups = head;
        if (groups.length !== 8) return null;
      } else {
        tail = doubleColonParts[1] ? doubleColonParts[1].split(":") : [];
        const missing = 8 - head.length - tail.length;
        if (missing < 1) return null;
        groups = head.concat(new Array(missing).fill("0")).concat(tail);
      }

      if (groups.length !== 8) return null;

      let result = 0n;
      for (const g of groups) {
        if (!/^[0-9a-fA-F]{1,4}$/.test(g)) return null;
        result = (result << 16n) | BigInt(parseInt(g, 16));
      }
      return result;
    }

    function formatIPv6(n) {
      const groups = [];
      for (let i = 7; i >= 0; i--) {
        groups.push(((n >> BigInt(i * 16)) & 0xffffn).toString(16));
      }

      let bestStart = -1, bestLen = 0, curStart = -1, curLen = 0;
      for (let i = 0; i < 8; i++) {
        if (groups[i] === "0") {
          if (curStart === -1) curStart = i;
          curLen++;
          if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
        } else {
          curStart = -1;
          curLen = 0;
        }
      }

      if (bestLen > 1) {
        const before = groups.slice(0, bestStart);
        const after = groups.slice(bestStart + bestLen);
        return before.join(":") + "::" + after.join(":");
      }
      return groups.join(":");
    }

    function computeRange(ipStr, prefix) {
      const isV6 = ipStr.indexOf(":") !== -1;
      const bits = isV6 ? 128 : 32;

      if (!Number.isInteger(prefix) || prefix < 0 || prefix > bits) {
        return { error: `Prefix must be between 0 and ${bits} for ${isV6 ? "IPv6" : "IPv4"}.` };
      }

      const ipInt = isV6 ? parseIPv6(ipStr) : parseIPv4(ipStr);
      if (ipInt === null) {
        return { error: `"${ipStr}" is not a valid ${isV6 ? "IPv6" : "IPv4"} address.` };
      }

      const full = (1n << BigInt(bits)) - 1n;
      const hostBits = BigInt(bits - prefix);
      const mask = hostBits === 0n ? full : (full << hostBits) & full;
      const network = ipInt & mask;
      const last = network | (~mask & full);

      return {
        start: isV6 ? formatIPv6(network) : formatIPv4(network),
        end: isV6 ? formatIPv6(last) : formatIPv4(last),
      };
    }

    const form = document.getElementById("cidr-form");
    const ipInput = document.getElementById("ip-input");
    const prefixInput = document.getElementById("prefix-input");
    const errorMsg = document.getElementById("error-msg");
    const result = document.getElementById("result");
    const resultStart = document.getElementById("result-start");
    const resultEnd = document.getElementById("result-end");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const ipStr = ipInput.value.trim();
      const prefixStr = prefixInput.value.trim().replace(/^\//, "");
      const prefix = parseInt(prefixStr, 10);

      const outcome = computeRange(ipStr, prefix);

      if (outcome.error) {
        errorMsg.textContent = outcome.error;
        errorMsg.classList.add("visible");
        result.classList.remove("visible");
        return;
      }

      errorMsg.classList.remove("visible");
      resultStart.textContent = outcome.start;
      resultEnd.textContent = outcome.end;
      result.classList.add("visible");
    });
  </script>
</body>
</html>
